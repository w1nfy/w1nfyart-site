backend:
  name: github
  repo: w1nfy/w1nfyart-site
  branch: main
  base_url: https://w1nfy-oauth.yadotalegenda.workers.dev

media_folder: "images"
public_folder: "/images"

collections:
  - name: "grids"
    label: "Dota 2 Сетки"
    folder: "data/grids"
    create: true
    slug: "{{id}}"
    fields:
      - {label: "ID (номер поста в TG)", name: "id", widget: "string"}
      - {label: "Название", name: "title", widget: "string"}
      - {label: "Ссылка на пост в TG", name: "tgLink", widget: "string"}
      - {label: "Главное превью", name: "image", widget: "image"}
      - {label: "Файл сетки (.json)", name: "gridFile", widget: "file", required: false}
      - {label: "Дополнительные картинки", name: "images", widget: "list", required: false, field: {label: "Картинка", name: "image", widget: "image"}}

  - name: "themes"
    label: "Steam Темы"
    folder: "data/themes"
    create: true
    slug: "{{id}}"
    fields:
      - {label: "ID (короткое имя, напр. military)", name: "id", widget: "string"}
      - {label: "Название", name: "title", widget: "string"}
      - {label: "Описание", name: "desc", widget: "text"}
      - {label: "Ссылка на пост в TG", name: "tgLink", widget: "string", required: false}
      - {label: "Превью темы", name: "image", widget: "image"}
      - {label: "Баннер для Steam", name: "banner", widget: "image", required: false}
      - {label: "CSS Код", name: "cssCode", widget: "code", default_language: "css", required: true}
